<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WRC 2026</title>

    <style>
        body {
            margin: 10px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f2f2f2;
            max-width: 100%;
        }

        h1 {
            text-align: center;
            color: #1E4F7A;
        }

        td {
            width: 60px;
        }

        td input {
            max-width: 50px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, .15);
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        thead tr:first-child {
            background: #1E4F7A;
            color: white;
        }

        thead tr:nth-child(2) {
            background: #D7E7F5;
            font-weight: bold;
        }

        .alumno {
            text-align: left;
            font-weight: bold;
            background: #fafafa;
        }

        .total {
            font-size: 18px;
            font-weight: bold;
            color: #1565C0;
        }

        .celda {
            display: flex;
            justify-content: center;
            gap: 5px;
        }

        button {
            width: 42px;
            height: 34px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #d9d9d9;
            font-weight: bold;
            transition: .2s;
        }

        button:hover {
            transform: scale(1.08);
        }

        button.activo {
            background: #4CAF50;
            color: white;
        }

        button:disabled {
            background: #ececec;
            color: #999;
            cursor: not-allowed;
        }
    </style>

</head>

<body>

    <h1>🏆 Competencia WRC 🏆</h1>


    <table>

        <thead>

            <tr>
                <th rowspan="2">Alumno</th>
                <th>SALIDA</th>
                <th>LANZAMIENTO</th>
                <th>VALIZA 1</th>
                <th>ACOMPLAMIENTO</th>
                <th>CAJA DE ENERGIA</th>
                <th>PUENTE</th>
                <th>VALIZA 2</th>
                <th>BANDERAS</th>
                <th>ATERRIZAJE</th>
                <th>MAPA ESTELAR</th>
                <th>Reinicios</th>
                <th>Smoothness</th>
                <th>Tiempo</th>
                <th>BONO</th>
                <th>TOTAL</th>
            </tr>

            <tr>
                <th>60</th>
                <th>60</th>
                <th>10 + 10 + 40</th>
                <th>60</th>
                <th>60</th>
                <th>60</th>
                <th>10 + 10 + 40</th>
                <th>60</th>
                <th>60</th>
                <th>10 + 50</th>
                <th>-5 c/u</th>
                <th>50</th>
                <th>3:00.0</th>
                <th>Max 30</th>
                <th>600</th>

            </tr>

        </thead>

        <tbody id="tablaAlumnos">

        </tbody>

    </table>


    <script>


        // ========================
        // LISTA DE ALUMNOS
        // ========================

        const alumnos = [
            "Emi lopez",
            "elian",
            "alonso",
            "cristian",
            "Miguel",
            "daniel",
            "aleck",
            "Dante",
            "Vicky",
            "Carmen",
            "Emiliano",
            "Hansel",
            "Denisse",
            "Julio",
            "Andrea",
            "san",
            "austin",
            "elizabeth"
        ];
        
        }

        // ========================
        // CONFIGURACIÓN RETOS
        // ========================

        const retos = [

            {
                id: "salida",
                nombre: "SALIDA",
                botones: [
                    { puntos: 60 }
                ]
            },

            {
                id: "lanzamiento",
                nombre: "LANZAMIENTO",
                botones: [
                    { puntos: 60 }
                ]
            },

            {
                id: "valiza",
                nombre: "VALIZA 1",
                botones: [
                    {
                        puntos: 10,
                    },
                    {
                        puntos: 10,
                        grupo: "v1"
                    },
                    {
                        puntos: 40,
                        requiere: "v1"
                    }
                ]
            },

            {
                nombre: "ACOPLAMIENTO",
                botones: [
                    { puntos: 60 }
                ]
            },

            {
                nombre: "CAJA DE ENERGIA",
                botones: [
                    { puntos: 60 }
                ]
            },

            {
                nombre: "PUENTE",
                botones: [
                    { puntos: 60 }
                ]
            },

            {
                nombre: "VALIZA 2",
                botones: [
                    {
                        puntos: 10,
                    },
                    {
                        puntos: 10,
                        grupo: "v2"
                    },
                    {
                        puntos: 40,
                        requiere: "v2"
                    }
                ]
            },

            {
                nombre: "BANDERAS",
                tipo: "select",
                max: 10
            },

            {
                id: "aterrizaje",
                nombre: "ATERRIZAJE",
                botones: [
                    { puntos: 60 }
                ]
            },

            {
                nombre: "MAPA ESTELAR",
                botones: [
                    {
                        puntos: 10,
                        grupo: "m1"
                    },
                    {
                        puntos: 50,
                        requiere: "m1"
                    }
                ]
            },
            {
                nombre: "REINICIOS",
                tipo: "reinicios",
                max: 10
            },
            {
                nombre: "SMOOTH",
                tipo: "smooth"
            },

            {
                nombre: "TIEMPO",
                tipo: "tiempo"
            }

        ];

        // ========================
        // GENERAR TABLA
        // ========================

        const tabla = document.getElementById("tablaAlumnos");


        alumnos.forEach(alumno => {


            let fila = document.createElement("tr");


            fila.innerHTML = `
    <td class="alumno">${alumno}</td>

    ${retos.map(reto => `

        <td data-reto="${reto.id || ''}">

        ${reto.tipo === "select" ?

                    `
            <input
                type="number"
                min="0"
                max="10"
                step="1"
                value="0"
                oninput="actualizarTotal(this.closest('tr'))">
            `

                    :

                    reto.tipo === "reinicios" ?

                        `
            <input
                type="number"
                min="0"
                value="0"
                class="reinicios"
                oninput="actualizarTotal(this.closest('tr'))">
            `

                        :

                        reto.tipo === "smooth" ?

                            `
            <span class="smooth">50</span>
            `

                            :

                            reto.tipo === "tiempo" ?

                                `
            <input
                type="text"
                class="tiempo"
                value="3:00.0"
                placeholder="2:45.3"
                oninput="actualizarTotal(this.closest('tr'))">
            `

                                :

                                `
            <div class="celda">

                ${reto.botones.map(btn => `

                    <button
                        data-puntos="${btn.puntos}"
                        ${btn.grupo ? `data-grupo="${btn.grupo}"` : ""}
                        ${btn.requiere ? `data-requiere="${btn.requiere}" disabled` : ""}
                        onclick="toggleBoton(this)">

                        ${btn.puntos}

                    </button>

                `).join("")}

            </div>
            `
                }

        </td>

    `).join("")}
        <td><span class="bono">0</span></td>
    <td class="total">0</td>
`;
            tabla.appendChild(fila);


        });




        // ========================
        // ACTIVAR BOTONES
        // ========================

        function toggleBoton(btn) {


            if (btn.disabled) return;


            btn.classList.toggle("activo");


            const grupo = btn.dataset.grupo;


            if (grupo) {


                const contenedor = btn.parentElement;


                const dependiente =
                    contenedor.querySelector(
                        `[data-requiere="${grupo}"]`
                    );


                if (btn.classList.contains("activo")) {

                    dependiente.disabled = false;

                }
                else {

                    dependiente.disabled = true;
                    dependiente.classList.remove("activo");

                }


            }


            actualizarTotal(btn.closest("tr"));

        }

        function actualizarTotal(fila) {

            let total = 0;


            //=========================
            // BOTONES
            //=========================

            fila.querySelectorAll(".activo").forEach(btn => {
                total += Number(btn.dataset.puntos);
            });


            //=========================
            // BANDERAS
            //=========================

            fila.querySelectorAll('input[type="number"]').forEach(input => {

                if (input.classList.contains("reinicios"))
                    return;

                total += (Number(input.value) || 0) * 6;
            });
            //=========================
            // TAREAS BÁSICAS
            //=========================

            const salida = fila.querySelector('[data-reto="salida"] button')
                ?.classList.contains("activo");

            const lanzamiento = fila.querySelector('[data-reto="lanzamiento"] button')
                ?.classList.contains("activo");

            const aterrizaje = fila.querySelector('[data-reto="aterrizaje"] button')
                ?.classList.contains("activo");

            const valiza = fila.querySelector('[data-reto="valiza"] button')
                ?.classList.contains("activo");

            const tareasBasicas =
                salida &&
                lanzamiento &&
                aterrizaje &&
                valiza;


            //=========================
            // SMOOTHNESS
            //=========================

            const inputReinicios = fila.querySelector(".reinicios");

            let reinicios = Number(inputReinicios.value) || 0;

            reinicios = Math.min(10, Math.max(0, reinicios));

            inputReinicios.value = reinicios;

            let smooth = 0;

                smooth = 50 - reinicios * 5;

                if (smooth < 0)
                    smooth = 0;
            

            fila.querySelector(".smooth").textContent = smooth;

            total += smooth;


            //=========================
            // TIEMPO
            //=========================

            let tiempoPts = 0;

            if (tareasBasicas) {

                const tiempo = fila.querySelector(".tiempo").value.trim();

                const partes = tiempo.split(":");

                if (partes.length === 2) {

                    const minutos = Number(partes[0]);
                    const segundos = Number(partes[1]);

                    const tiempoTotal = minutos * 60 + segundos;
                    const sobrante = 180 - tiempoTotal;

                    if (sobrante >= 30) {
                        tiempoPts = 30;
                    } else if (sobrante >= 20) {
                        tiempoPts = 20;
                    } else if (sobrante >= 10) {
                        tiempoPts = 10;
                    } else if (sobrante >= 3) {
                        tiempoPts = 5;
                    } else {
                        tiempoPts = 0;
                    }
                }
            }

            fila.querySelector(".bono").textContent = tiempoPts;

            total += tiempoPts;


            //=========================
            // MOSTRAR TOTAL
            //=========================

            fila.querySelector(".total").textContent = total;

        }




    </script>


</body>

</html>
