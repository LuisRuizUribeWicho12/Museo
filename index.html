<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WRC 2026</title>

    <style>
        body {
            margin: 30px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f2f2f2;
        }

        h1 {
            text-align: center;
            color: #1E4F7A;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, .15);
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        thead tr:first-child {
            background: #1E4F7A;
            color: white;
        }

        thead tr:nth-child(2) {
            background: #D7E7F5;
            font-weight: bold;
        }

        .alumno {
            text-align: left;
            font-weight: bold;
            background: #fafafa;
        }

        .total {
            font-size: 18px;
            font-weight: bold;
            color: #1565C0;
        }

        .celda {
            display: flex;
            justify-content: center;
            gap: 5px;
        }

        button {
            width: 42px;
            height: 34px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #d9d9d9;
            font-weight: bold;
            transition: .2s;
        }

        button:hover {
            transform: scale(1.08);
        }

        button.activo {
            background: #4CAF50;
            color: white;
        }

        button:disabled {
            background: #ececec;
            color: #999;
            cursor: not-allowed;
        }
    </style>

</head>

<body>

    <h1>🏆 Competencia WRC 🏆</h1>


    <table>

        <thead>

            <tr>
                <th rowspan="2">Alumno</th>
                <th>SALIDA</th>
                <th>LANZAMIENTO</th>
                <th>VALIZA 1</th>
                <th>ACOMPLAMIENTO</th>
                <th>CAJA DE ENERGIA</th>
                <th>PUENTE</th>
                <th>VALIZA 2</th>
                <th>BANDERAS</th>
                <th>ATERRIZAJE</th>
                <th>MAPA ESTELAR</th>

                <th rowspan="2">TOTAL</th>
            </tr>

            <tr>
                <th>60</th>
                <th>60</th>
                <th>20 + 40</th>
                <th>60</th>
                <th>60</th>
                <th>60</th>
                <th>20 + 40</th>
                <th>60</th>
                <th>60</th>
                <th>10 + 50</th>

            </tr>

        </thead>

        <tbody id="tablaAlumnos">

        </tbody>

    </table>


    <script>


        // ========================
        // LISTA DE ALUMNOS
        // ========================

        const alumnos = [
            "Dante",
            "Vicky",
            "Carmen",
            "Emiliano",
            "Hansel",
            "Denisse",
            "Julio",
            "Andrea"
        ];


        // ========================
        // CONFIGURACIÓN RETOS
        // ========================

        const retos = [

            {
                nombre: "SALIDA",
                botones: [
                    { puntos: 60 }
                ]
            },

            {
                nombre: "LANZAMIENTO",
                botones: [
                    { puntos: 60 }
                ]
            },

            {
                nombre: "VALIZA 1",
                botones: [
                    {
                        puntos: 20,
                        grupo: "v1"
                    },
                    {
                        puntos: 40,
                        requiere: "v1"
                    }
                ]
            },

            {
                nombre: "ACOPLAMIENTO",
                botones: [
                    { puntos: 60 }
                ]
            },

            {
                nombre: "CAJA DE ENERGIA",
                botones: [
                    { puntos: 60 }
                ]
            },

            {
                nombre: "PUENTE",
                botones: [
                    { puntos: 60 }
                ]
            },

            {
                nombre: "VALIZA 2",
                botones: [
                    {
                        puntos: 20,
                        grupo: "v2"
                    },
                    {
                        puntos: 40,
                        requiere: "v2"
                    }
                ]
            },

            {
                nombre: "BANDERAS",
                tipo: "select",
                max: 10
            },

            {
                nombre: "ATERRIZAJE",
                botones: [
                    { puntos: 60 }
                ]
            },

            {
                nombre: "MAPA ESTELAR",
                botones: [
                    {
                        puntos: 10,
                        grupo: "m1"
                    },
                    {
                        puntos: 50,
                        requiere: "m1"
                    }
                ]
            }

        ];

        // ========================
        // GENERAR TABLA
        // ========================

        const tabla = document.getElementById("tablaAlumnos");


        alumnos.forEach(alumno => {


            let fila = document.createElement("tr");


            fila.innerHTML =
                `
    <td class="alumno">${alumno}</td>

    ${retos.map(reto => `

            <td>

${reto.tipo === "select"
                        ?

                        `
<input
    type="number"
    min="0"
    max="10"
    step="1"
    value="0"
    oninput="actualizarTotal(this.closest('tr'))">
`

                        :

                        `
    <div class="celda">

    ${reto.botones.map(btn => `

    <button
    data-puntos="${btn.puntos}"
    ${btn.grupo ? `data-grupo="${btn.grupo}"` : ""}
    ${btn.requiere ?
                                `data-requiere="${btn.requiere}" disabled`
                                : ""}
    onclick="toggleBoton(this)">

    ${btn.puntos}

    </button>

`).join("")
                        }

    </div>
    `
                    }

</td>

        `).join("")
                }


    <td class="total">0</td>

    `;


            tabla.appendChild(fila);


        });




        // ========================
        // ACTIVAR BOTONES
        // ========================

        function toggleBoton(btn) {


            if (btn.disabled) return;


            btn.classList.toggle("activo");


            const grupo = btn.dataset.grupo;


            if (grupo) {


                const contenedor = btn.parentElement;


                const dependiente =
                    contenedor.querySelector(
                        `[data-requiere="${grupo}"]`
                    );


                if (btn.classList.contains("activo")) {

                    dependiente.disabled = false;

                }
                else {

                    dependiente.disabled = true;
                    dependiente.classList.remove("activo");

                }


            }


            actualizarTotal(btn.closest("tr"));

        }




        function actualizarTotal(fila) {

            let total = 0;

            // Sumar botones activos
            fila.querySelectorAll(".activo").forEach(btn => {
                total += Number(btn.dataset.puntos);
            });

            // Sumar banderas (6 puntos por bandera)
            fila.querySelectorAll('input[type="number"]').forEach(input => {
                total += (Number(input.value) || 0) * 6;
            });

            fila.querySelector(".total").textContent = total;

        }

    </script>


</body>

</html>
